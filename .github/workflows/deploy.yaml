# GitHub Actions — deploy to Cloudflare Pages.
# Builds on a GitHub-hosted ubuntu runner with Docker, then publishes dist/ to
# Cloudflare Pages. The PDF is deliberately never built by `make site` and is
# workstation-local only.
#
# Repository secrets:
# - CLOUDFLARE_API_TOKEN  : Cloudflare API token with "Cloudflare Pages: Edit" permissions
# - CLOUDFLARE_ACCOUNT_ID : Cloudflare Account ID
#
# Required repository variable (Settings → Secrets and variables → Actions → Variables):
# - CLOUDFLARE_PROJECT_NAME : target Pages project name.
#   There is intentionally no default: when unset the deploy is skipped so a
#   stale project is never targeted. Set it to the new Pages project name.
name: Deploy

permissions:
  contents: read
  deployments: write

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/**'
      - 'static/**'
      - 'styles/**'
      - 'templates/**'
      - 'config.toml'
      - 'tailwind.config.js'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/workflows/deploy.yaml'

env:
  # GitHub-hosted ubuntu has no SELinux; drop the bind-mount relabel (:z).
  SELINUX_LABEL: ""
  # Docker is preinstalled on GitHub-hosted runners (avoids rootless-Podman storage issues).
  CONTAINER_ENGINE: docker

jobs:
  build-and-deploy:
    name: Build & Deploy Site
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build static site (CSS, HTML, OG card, Markdown CV — no PDF)
        run: |
          set -euo pipefail
          make image
          make site

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PROJECT_NAME != '' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Skip deploy when Cloudflare is not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_PROJECT_NAME == '' }}
        run: |
          echo "Cloudflare deploy skipped: incomplete configuration."
          echo "Configure these in the repository before deploying to the new Pages project:"
          echo "  variable CLOUDFLARE_PROJECT_NAME (target Pages project name)"
          echo "  secret   CLOUDFLARE_API_TOKEN  (Cloudflare Pages: Edit)"
          echo "  secret   CLOUDFLARE_ACCOUNT_ID (Cloudflare Account ID)"
