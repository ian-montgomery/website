pre-commit:
  commands:
    lint-shell:
      glob: '*.sh'
      run: make lint-shell

    lint-yaml:
      glob: '*.{yaml,yml}'
      run: make lint-yaml

    lint-semgrep:
      glob: '*.{js,json,md,yaml,yml}'
      run: make lint-semgrep

    lint-secrets:
      run: make lint-secrets BETTERLEAKS_FLAGS="--pre-commit --staged"

pre-push:
  parallel: true
  commands:
    lint:
      run: make lint

    lint-secrets:
      run: make lint-secrets

    build-check:
      run: make build
