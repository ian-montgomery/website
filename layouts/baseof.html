<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ block "title" . }}{{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ block "description" . }}{{ site.Params.description }}{{ end }}" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="{{ .Permalink }}" />
    <meta property="og:title" content="{{ block "og_title" . }}{{ site.Title }}{{ end }}" />
    <meta property="og:description" content="{{ block "og_description" . }}{{ site.Params.og_description | default site.Params.description }}{{ end }}" />
    <meta property="og:image" content="{{ "generated/og/index.png" | absURL }}" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="{{ relURL "favicon.svg" }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    {{ partial "css.html" . }}
    <script src="{{ relURL "js/app.js" }}" defer></script>
  </head>
  <body class="bg-white font-mono text-black antialiased{{ block "body_class" . }}{{ end }}">
    <a
      href="#main"
      class="im-screen-only sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:border-2 focus:border-black focus:bg-black focus:px-3 focus:py-2 focus:font-bold focus:text-white"
      >Skip to content</a
    >
    {{ block "main" . }}{{ end }}
  </body>
</html>
