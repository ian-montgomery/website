<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>{{ block "title" . }}{{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ block "description" . }}{{ site.Params.description }}{{ end }}" />
    {{ partial "css.html" . }}
    <link rel="canonical" href="{{ .Permalink }}" />
    <meta property="og:title" content="{{ block "og_title" . }}{{ site.Title }}{{ end }}" />
    <meta property="og:description" content="{{ block "og_description" . }}{{ site.Params.og_description | default site.Params.description }}{{ end }}" />
    <meta property="og:image" content="{{ "generated/og/index.png" | absURL }}" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="{{ relURL "favicon.svg" }}" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ relURL "fonts/IBMPlexMono-Regular.woff2" }}" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ relURL "fonts/IBMPlexMono-Bold.woff2" }}" />
    {{ partial "js.html" . }}
  </head>
  <body class="bg-white font-mono text-black antialiased{{ block "body_class" . }}{{ end }}">
    <a href="#main" class="im-skip-link im-screen-only">Skip to content</a>
    {{ block "main" . }}{{ end }}
  </body>
</html>
