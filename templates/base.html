<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ config.title }}</title>
    <meta name="description" content="{{ config.description }}" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="{{ current_url | safe }}" />
    <meta property="og:title" content="{{ config.title }}" />
    <meta property="og:description" content="{{ config.extra.og_description | default(value=config.description) }}" />
    <meta property="og:image" content="{{ config.base_url | safe }}/generated/og/index.png" />
    <meta property="og:url" content="{{ current_url | safe }}" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    {# Monospace type: "IBM Plex Mono" from Google Fonts, "Courier New" fallback. #}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/app.js" defer></script>
  </head>
  <body class="bg-white font-mono text-black antialiased">
    <a
      href="#main"
      class="im-screen-only sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:border-2 focus:border-black focus:bg-black focus:px-3 focus:py-2 focus:font-bold focus:text-white"
      >Skip to content</a
    >
    {% block content %}{% endblock content %}
  </body>
</html>
