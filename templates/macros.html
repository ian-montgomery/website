{# Square 1-bit skill chip. Rendered as an <li> so it can live inside a <ul>. #}
{% macro skill_chip(item) %}
<li class="im-chip">
  {% if item.url %}
  <a
    href="{{ item.url | safe }}"
    target="_blank"
    rel="noopener noreferrer"
    class="im-chip__label"
    >{{ item.name }}</a
  >
  {% else %}
  <span class="im-chip__label">{{ item.name }}</span>
  {% endif %}
  {% if item.description %}
  <button type="button" data-target="popover-{{ item.id }}" class="im-chip__info" aria-label="More about {{ item.name }}" aria-describedby="popover-{{ item.id }}">?</button>
  <div
    id="popover-{{ item.id }}"
    data-popover
    role="tooltip"
    class="hidden fixed z-50 m-0 max-w-[min(32rem,calc(100vw-1rem))] border-2 border-black bg-white px-3 py-2 text-xs text-black shadow-none"
  >
    {{ item.description }}
  </div>
  {% endif %}
</li>
{% endmacro skill_chip %}
